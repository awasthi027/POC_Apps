<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Analytics</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10131a; --card:#181c26; --text:#e8ebf2; --muted:#98a2b3; --line:#2a3040; --accent:#6ea0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center; }
  select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  button { cursor:pointer; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .label { color:var(--muted); font-size:13px; }
  .card .value { font-size:26px; font-weight:600; margin-top:2px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:15px; margin:0 0 10px; }
  .chart { position:relative; height:280px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width: 800px) { .row { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
  #status { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Event Analytics</h1>

  <div class="controls">
    <label>Project <select id="project"></select></label>
    <label>Period
      <select id="range">
        <option value="1">Last hour</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
    </label>
    <label>Event <select id="event"><option value="">All events</option></select></label>
    <button id="refresh">Refresh</button>
    <span id="status"></span>
  </div>

  <div class="cards">
    <div class="card"><div class="label">Events</div><div class="value" id="c-total">-</div></div>
    <div class="card"><div class="label">Users</div><div class="value" id="c-users">-</div></div>
    <div class="card"><div class="label">Sessions</div><div class="value" id="c-sessions">-</div></div>
    <div class="card"><div class="label">Event types</div><div class="value" id="c-types">-</div></div>
  </div>

  <div class="panel">
    <h2>Events over time</h2>
    <div class="chart"><canvas id="timeChart"></canvas></div>
  </div>

  <div class="row">
    <div class="panel">
      <h2>Top events</h2>
      <div class="chart"><canvas id="topChart"></canvas></div>
    </div>
    <div class="panel">
      <h2>Latest events</h2>
      <div id="recent"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let timeChart, topChart;

async function api(path, params = {}) {
  const query = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
  const response = await fetch(`${path}?${query}`);
  if (!response.ok) throw new Error(`${path} returned ${response.status}`);
  return response.json();
}

function period() {
  const hours = Number($('range').value);
  const to = new Date();
  return { from: new Date(to - hours * 3600e3).toISOString(), to: to.toISOString(), hours };
}

function labelFor(iso, hours) {
  const d = new Date(iso);
  return hours <= 72 ? d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                     : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

async function loadProjects() {
  const projects = await api('/api/projects');
  const previous = $('project').value;
  $('project').innerHTML = projects.map(p => `<option>${escapeHtml(p)}</option>`).join('');
  if (projects.includes(previous)) $('project').value = previous;
  return projects.length > 0;
}

async function load() {
  $('status').textContent = 'Loading...';
  try {
    if (!(await loadProjects())) {
      $('status').textContent = 'No events stored yet. Send some with scripts/send-sample-events.sh';
      return;
    }
    const project = $('project').value;
    const { from, to, hours } = period();
    const event = $('event').value;

    const [summary, series, top, recent] = await Promise.all([
      api('/api/stats/summary', { project, from, to }),
      api('/api/stats/timeseries', { project, from, to, event }),
      api('/api/stats/top-events', { project, from, to }),
      api('/api/events/recent', { project, limit: 10 }),
    ]);

    $('c-total').textContent = summary.total_events.toLocaleString();
    $('c-users').textContent = summary.unique_users.toLocaleString();
    $('c-sessions').textContent = summary.sessions.toLocaleString();
    $('c-types').textContent = summary.event_types.toLocaleString();

    // Event dropdown: keep the current choice.
    const names = top.map(t => t.name);
    if (event && !names.includes(event)) names.push(event);
    $('event').innerHTML = '<option value="">All events</option>' + names.map(n => `<option>${escapeHtml(n)}</option>`).join('');
    $('event').value = event;

    drawTime(series, hours);
    drawTop(top);
    drawRecent(recent);
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  }
}

function drawTime(series, hours) {
  const data = { labels: series.map(p => labelFor(p.bucket, hours)), datasets: [{ label: 'Events', data: series.map(p => p.count),
    borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.15)', fill: true, tension: .25, pointRadius: series.length > 60 ? 0 : 3 }] };
  if (timeChart) { timeChart.data = data; timeChart.update(); return; }
  timeChart = new Chart($('timeChart'), { type: 'line', data,
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
               scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { maxTicksLimit: 8 } } } } });
}

function drawTop(top) {
  const data = { labels: top.map(t => t.name), datasets: [{ label: 'Events', data: top.map(t => t.count), backgroundColor: '#2563eb' }] };
  if (topChart) { topChart.data = data; topChart.update(); return; }
  topChart = new Chart($('topChart'), { type: 'bar', data,
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
               scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } } });
}

function drawRecent(rows) {
  if (!rows.length) { $('recent').innerHTML = '<div class="empty">No events</div>'; return; }
  $('recent').innerHTML = '<table><tr><th>Event</th><th>Who</th><th>Time</th></tr>' + rows.map(r =>
    `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.user_id || (r.anonymous_id || '').slice(0, 8) || '-')}</td>` +
    `<td>${new Date(r.time).toLocaleTimeString()}</td></tr>`).join('') + '</table>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

['project', 'range', 'event'].forEach(id => $(id).addEventListener('change', load));
$('refresh').addEventListener('click', load);
load();
setInterval(load, 15000);   // refresh every 15 seconds
</script>
</body>
</html>
