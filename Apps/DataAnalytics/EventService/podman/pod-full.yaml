# Postgres + Kafka + the event service, all in one Podman pod.
#   podman build -t event-service -f podman/Containerfile .      (once, and after code changes)
#   podman kube play podman/pod-full.yaml
#   podman kube down podman/pod-full.yaml
#
# Open http://localhost:8080/
# The service container may start before Postgres is ready and exit; restartPolicy Always starts it again
# until the database accepts connections.
apiVersion: v1
kind: Pod
metadata:
  name: analytics
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/library/postgres:16
      env:
        - { name: POSTGRES_DB, value: analytics }
        - { name: POSTGRES_USER, value: analytics }
        - { name: POSTGRES_PASSWORD, value: analytics }
      ports:
        - { containerPort: 5432, hostPort: 5433 }
      volumeMounts:
        - { name: pgdata, mountPath: /var/lib/postgresql/data }

    - name: kafka
      image: docker.io/apache/kafka:3.8.0
      env:
        - { name: KAFKA_NODE_ID, value: "1" }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
        - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://localhost:9092" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
        - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
      ports:
        - { containerPort: 9092, hostPort: 9092 }

    - name: event-service
      image: localhost/event-service:latest
      env:
        # Same pod = same "localhost", so the service uses Postgres' own port 5432 here, not 5433.
        - { name: DB_URL, value: "jdbc:postgresql://localhost:5432/analytics" }
        - { name: KAFKA_BOOTSTRAP, value: "localhost:9092" }
      ports:
        - { containerPort: 8080, hostPort: 8080 }

  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: analytics-pgdata
